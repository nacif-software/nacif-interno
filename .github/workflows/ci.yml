name: CI

# quality: roda em todo PR e em todo push na main.
# e2e: roda só em PRs cujo destino é a main (ver AGENTS.md, seção CI).
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nacif
          POSTGRES_PASSWORD: nacif
          POSTGRES_DB: nacif_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nacif -d nacif_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nacif:nacif@localhost:5433/nacif_test
      DATABASE_URL: postgresql://nacif:nacif@localhost:5433/nacif_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nacif/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: ./scripts/vocab-check.sh
      - run: pnpm test:shared
      - run: pnpm test:web
      - run: pnpm test:api

  e2e:
    # Só em PRs para a main: é o job mais caro e a main só recebe código por PR.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: quality
    env:
      # e2e roda contra o build de produção servido por `vite preview` (ver e2e/playwright.config.ts)
      E2E_PREVIEW: 'true'
      VITE_API_PROXY_TARGET: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait db api
      - run: docker compose exec -T api pnpm --filter @nacif/api exec prisma migrate deploy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nacif/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker compose logs --tail 200 api
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - run: docker compose down -v
        if: always()
