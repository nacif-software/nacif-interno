name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nacif
          POSTGRES_PASSWORD: nacif
          POSTGRES_DB: nacif_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U nacif -d nacif_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nacif:nacif@localhost:5433/nacif_test
      DATABASE_URL: postgresql://nacif:nacif@localhost:5433/nacif_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nacif/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: ./scripts/vocab-check.sh
      - run: pnpm test:shared
      - run: pnpm test:web
      - run: pnpm test:api

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait db api web
      - run: docker compose exec -T api pnpm --filter @nacif/api exec prisma migrate deploy
      - run: docker compose exec -T api pnpm --filter @nacif/api exec prisma db seed
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nacif/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - run: docker compose down -v
        if: always()
