name: CI

# quality: roda em todo PR e em todo push na main.
# e2e: roda só em PRs cujo destino é a main (ver AGENTS.md, seção CI).
on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.dev.vars.example apps/api/.dev.vars
      - run: pnpm --filter @nacif/api types
      - run: pnpm lint
      - run: pnpm typecheck
      - run: ./scripts/vocab-check.sh
      - run: pnpm test:shared
      - run: pnpm test:web
      # Testes da API rodam no runtime Workers (workerd) com um D1 local; não precisam de serviço externo.
      - run: pnpm test:api
      # Valida o bundle do Worker e os assets do web sem publicar.
      - run: pnpm --filter @nacif/web build
      - run: pnpm --filter @nacif/api deploy:check

  e2e:
    # Só em PRs para a main: é o job mais caro e a main só recebe código por PR.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp apps/api/.dev.vars.example apps/api/.dev.vars
      - run: pnpm --filter @nacif/api types
      - run: pnpm --filter @nacif/e2e exec playwright install --with-deps chromium
      # O Playwright sobe o Worker sozinho (build do web + migrações + wrangler dev); ver e2e/playwright.config.ts.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
