name: nacif-interno

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nacif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nacif}
      POSTGRES_DB: ${POSTGRES_DB:-nacif}
    ports:
      - '${DB_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nacif} -d ${POSTGRES_DB:-nacif}']
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: nacif
      POSTGRES_PASSWORD: nacif
      POSTGRES_DB: nacif_test
    ports:
      - '${DB_TEST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nacif -d nacif_test']
      interval: 2s
      timeout: 3s
      retries: 20

  # Instala as dependências uma única vez nos volumes compartilhados.
  # api e web só sobem depois que este serviço termina com sucesso
  # (evita dois `pnpm install` concorrentes sobre os mesmos volumes).
  deps:
    build: &dev-build
      context: .
      dockerfile: docker/dev.Dockerfile
    command: pnpm install --frozen-lockfile --prefer-offline
    working_dir: /workspace
    volumes: &dev-volumes
      - .:/workspace
      - root_modules:/workspace/node_modules
      - api_modules:/workspace/apps/api/node_modules
      - web_modules:/workspace/apps/web/node_modules
      - shared_modules:/workspace/packages/shared/node_modules
      - e2e_modules:/workspace/e2e/node_modules
      - pnpm_store:/pnpm/store

  api:
    build: *dev-build
    command: pnpm --filter @nacif/api dev
    working_dir: /workspace
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nacif}:${POSTGRES_PASSWORD:-nacif}@db:5432/${POSTGRES_DB:-nacif}
      PORT: 3000
    ports:
      - '${API_PORT:-3010}:3000'
    volumes: *dev-volumes
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully

  web:
    build: *dev-build
    command: pnpm --filter @nacif/web dev
    working_dir: /workspace
    env_file: .env
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes: *dev-volumes
    depends_on:
      api:
        condition: service_started
      deps:
        condition: service_completed_successfully

volumes:
  pgdata:
  root_modules:
  api_modules:
  web_modules:
  shared_modules:
  e2e_modules:
  pnpm_store:
